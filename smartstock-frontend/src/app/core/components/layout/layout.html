<mat-sidenav-container class="app-shell">
  <mat-sidenav #drawer [mode]="isCompact() ? 'over' : 'side'" [opened]="!isCompact()" class="sidebar">
    <div class="brand"><div class="brand-mark">SS</div><div><strong>SmartStock</strong><span>Inventory control</span></div></div>
    <div class="nav-label">Workspace</div>
    <mat-nav-list class="nav-list">
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link" (click)="closeNavigation(drawer)"><mat-icon matListItemIcon>space_dashboard</mat-icon><span matListItemTitle>Dashboard</span></a>
      <a mat-list-item routerLink="/products" routerLinkActive="active-link" (click)="closeNavigation(drawer)"><mat-icon matListItemIcon>inventory_2</mat-icon><span matListItemTitle>Productos</span></a>
      <a mat-list-item routerLink="/catalog" routerLinkActive="active-link" (click)="closeNavigation(drawer)"><mat-icon matListItemIcon>category</mat-icon><span matListItemTitle>Catálogo</span></a>
      <a mat-list-item routerLink="/history" routerLinkActive="active-link" (click)="closeNavigation(drawer)"><mat-icon matListItemIcon>history</mat-icon><span matListItemTitle>Historial</span></a>
    </mat-nav-list>
    <div class="sidebar-footer"><button mat-list-item class="logout-button" (click)="logout()"><mat-icon matListItemIcon>logout</mat-icon><span matListItemTitle>Salir</span></button></div>
  </mat-sidenav>
  <mat-sidenav-content class="content-shell">
    <mat-toolbar class="topbar">
      <button mat-icon-button (click)="drawer.toggle()" aria-label="Abrir o cerrar navegación"><mat-icon>menu</mat-icon></button>
      <div class="topbar-title"><span class="eyebrow">SmartStock</span><strong>Panel de inventario</strong></div>
      <span class="topbar-spacer"></span><span class="version-chip">v1.1</span>
    </mat-toolbar>
    <main class="main-content"><router-outlet></router-outlet></main>
  </mat-sidenav-content>
</mat-sidenav-container>
