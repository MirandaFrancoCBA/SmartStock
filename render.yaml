services:
  - type: web
    name: smartstock-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: PGDATABASE
        fromDatabase:
          name: smartstock-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: smartstock-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: smartstock-db
          property: password
      - key: PGHOST
        fromDatabase:
          name: smartstock-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: smartstock-db
          property: port

databases:
  - name: smartstock-db
    plan: free
    databaseName: smartstock
    user: smartstock_user
